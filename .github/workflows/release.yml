# Publishes to npm when a version tag is pushed.
#
# Deliberately tag-driven rather than publishing on every merge to main: a
# release is a decision, and `npm publish` cannot be taken back — a version
# number is burned even if the package is immediately unpublished.
#
# Requires an NPM_TOKEN secret with publish rights on the package.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.18.1"
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # The same gate as CI. `prepublishOnly` runs build and tests again during
      # publish; running the complete gate here means a bad tag fails before
      # anything is uploaded.
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run measure
      - run: npm run verify:evals

      - name: Generated tool docs are up to date
        run: |
          npm run docs
          git diff --exit-code -- docs/TOOLS.md

      # Catches the mistake this workflow exists to prevent: a tag that does not
      # match the version being published.
      - name: Tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      - name: Confirm and smoke-test the tarball
        run: |
          npm pack --json > /tmp/pack.json
          node <<'NODE'
          const fs = require("node:fs");
          const pack = JSON.parse(fs.readFileSync("/tmp/pack.json", "utf8"))[0];
          const paths = pack.files.map((file) => file.path).sort();
          const required = ["dist/index.js", "resources/openapi.json", "package.json", "README.md", "LICENSE", "SECURITY.md"];
          const forbidden = paths.filter((path) => /^(evaluations|scripts|src|test)\//.test(path));
          if (pack.entryCount !== 22) throw new Error(`expected 22 package entries, found ${pack.entryCount}`);
          for (const path of required) if (!paths.includes(path)) throw new Error(`${path} missing from tarball`);
          if (forbidden.length) throw new Error(`development-only files in tarball: ${forbidden.join(", ")}`);
          fs.writeFileSync("/tmp/tarball-name", pack.filename);
          NODE
          TARBALL="$(cat /tmp/tarball-name)"
          INSTALL_ROOT="$(mktemp -d)"
          npm install --prefix "$INSTALL_ROOT" "./$TARBALL"
          test "$("$INSTALL_ROOT/node_modules/.bin/ivedaai-mcp-server" --version)" = "${GITHUB_REF_NAME#v}"
          "$INSTALL_ROOT/node_modules/.bin/ivedaai-mcp-server" --help | grep -q "IVEDAAI_UPLOAD_ROOT"
          rm -rf "$INSTALL_ROOT" "$TARBALL"

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
