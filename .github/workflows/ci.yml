# Runs the checks that need nothing but the repo.
#
# Every "tests pass, build clean" claim on this project's pull requests has so
# far been someone's local run, stated as such in the PR body because there was
# nothing else to point at. The unit, CRUD and integration suites need no
# credentials and no deployment — the integration tests bring up their own mock
# server — so there is no reason for that to stay true.
#
# What this deliberately does NOT run: anything under `scripts/` that touches a
# live deployment. Those are gated behind IVEDAAI_ALLOW_WRITE_PROBE and real
# credentials, they create and delete records on a shared server, and a probe
# firing on every push would be both destructive and rate-limited. They stay
# manual, which is the point of the gate.
name: CI

on:
  push:
    branches: [master]
  pull_request:

# A newer push to the same branch makes the older run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # One version failing should not hide whether the other does too.
      fail-fast: false
      matrix:
        # 20.18.1 is the real floor: undici 7 declares `>=20.18.1`, so the
        # package cannot run below it whatever package.json's `engines` says.
        # 24.x is current. Testing both catches a dependency that quietly needs
        # something newer, which is exactly how the old floor went stale.
        node: ["20.18.1", "24.x"]
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `ci` rather than `install`: fails on a lockfile that disagrees with
      # package.json instead of quietly resolving something else.
      - run: npm ci

      - run: npm run build

      # `build` only compiles src/ — that is the shipped artifact and its scope
      # should stay that way. This covers scripts/ and test/ as well, which
      # nothing else does: vitest never typechecks, and the probe scripts are the
      # code that writes to live deployments.
      - run: npm run typecheck

      - run: npm test

      # Cheap, needs no credentials, and renders every tool description across
      # all 62 tags — so it fails if `describeTag` throws on some operation the
      # unit tests do not construct. Prints the context budget into the log,
      # which is the number the README and hand-off doc quote.
      - name: Measure the tool-description budget
        run: npm run measure
