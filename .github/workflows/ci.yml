# Runs the checks that need nothing but the repo.
#
# The unit, integration, and MCP-over-stdio suites need no credentials or
# deployment; they bring up their own mock server.
#
# Live-deployment probes and their credentials remain in the private engineering
# repository and are deliberately outside this public CI surface.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # One version failing should not hide whether the other does too.
      fail-fast: false
      matrix:
        node: ["22.12.0", "24.x"]
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `ci` rather than `install`: fails on a lockfile that disagrees with
      # package.json instead of quietly resolving something else.
      - run: npm ci
      - run: npm audit --audit-level=high

      - run: npm run build

      # `build` only compiles src/ — that is the shipped artifact and its scope
      # should stay that way. This covers scripts/ and test/ as well; vitest does
      # not typecheck either one.
      - run: npm run typecheck

      - run: npm test

      # Cheap, needs no credentials, and renders every tool description across
      # all 63 tags — so it fails if `describeTag` throws on some operation the
      # unit tests do not construct. Prints the context budget into the log.
      - name: Measure the tool-description budget
        run: npm run measure

      # These answers are facts about the bundled spec. Fail if a spec upgrade
      # makes the checked-in evaluation stale.
      - name: Evaluation answers still match the spec
        run: npm run verify:evals

      # The tool reference is generated. Surface the exact diff if it drifts.
      - name: Generated tool docs are up to date
        run: |
          npm run docs
          if ! git diff --exit-code -- docs/TOOLS.md; then
            echo "::error::docs/TOOLS.md is stale — run 'npm run docs' and commit the result"
            exit 1
          fi
